# Self-hosted n8n for LendLoop automations.
# Usage: docker compose --env-file .env.local up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      # Secrets and endpoints are read by the workflows via $env.* (never stored in workflow JSON).
      LENDLOOP_HMAC_SECRET: ${LENDLOOP_HMAC_SECRET:?set LENDLOOP_HMAC_SECRET}
      LENDLOOP_CONVEX_SITE_URL: ${LENDLOOP_CONVEX_SITE_URL:?set LENDLOOP_CONVEX_SITE_URL}
      # Needed so Code nodes can use Node's crypto module and read $env.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - ./n8n_data:/home/node/.n8n
